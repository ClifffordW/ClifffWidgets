<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drop Clock</title>
  <!--
    Drop clock overlay for OBS: the Don't Starve day clock as a Browser Source.
    Options (all optional):  ?size=300      clock size in px (120 to 800)
                             &hand=time     hand follows your local time of day (default)
                             &hand=drop     hand makes one lap from the drop's start to its end
                             &phase=night   preview another time of day (day, dusk or night); normally it follows your clock
    The middle counts the days left. Suggested Browser Source size: the clock size plus about 20 px.
    The clock art is read from ../../Webpage/Assets/Clock/ so keep the folders where they are.
  -->
  <style>
    @font-face { font-family: Hammerhead; src: url(../../Fonts/HammerheadBold.ttf); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent; overflow: hidden; }
    body { display: grid; place-items: center; min-height: 100vh; }
    .clock { --clk: 300px; --r: 0deg; position: relative; width: var(--clk); height: var(--clk); font-size: calc(var(--clk) / 10); opacity: 0; transition: opacity 0.6s ease; }
    .clock.ready { opacity: 1; }
    .clock > img, .clock > .wedges, .clock > .pulse { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    .glow { width: 90%; opacity: 0.38; filter: url(#clkGlow); -webkit-mask-image: radial-gradient(circle closest-side, transparent 58%, #000 68%); mask-image: radial-gradient(circle closest-side, transparent 58%, #000 68%); }   /* only around the dial, never over it */
    .sun { width: 100%; transition: opacity 1.2s ease; }
    .face, .rim { width: 87.1%; }
    .wedges { width: 87.1%; aspect-ratio: 1; }
    .wedge { position: absolute; left: 50%; bottom: 50%; width: 20.74%; height: 40%; transform-origin: 0 100%; transform: rotate(var(--w)); }
    .hand { width: 90.3%; transform: translate(-50%, -50%) rotate(var(--r)) !important; transition: transform 1s linear; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.6)); }
    .pulse { width: 92%; aspect-ratio: 1; background: url("../../Webpage/Assets/Clock/hilite/hilite-2.png") center / contain no-repeat; opacity: 0; }
    .hub {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 34%; aspect-ratio: 1; border-radius: 50%;
      display: grid; place-content: center; text-align: center; line-height: 1; font-family: Hammerhead, serif;
      background: radial-gradient(circle, #2b1d15 0%, #120c09 80%); border: 3px solid #d9b45a; box-shadow: inset 0 0 8px #000, 0 2px 6px rgba(0, 0, 0, 0.8);
    }
    .hub b { font-size: 1.9em; font-weight: normal; color: #fff; text-shadow: 0 0 10px rgba(255, 142, 60, 0.55); }
    .hub small { font-size: 0.62em; color: #d9b45a; letter-spacing: 1px; margin-top: 2px; }
    .clock[data-state="live"] .sun { animation: sun 4s ease-in-out infinite alternate; }
    .clock[data-state="live"] .pulse { animation: pulse 4.5s linear infinite; }
    .clock[data-state="soon"] .sun { filter: brightness(0.6) saturate(0.7); }
    .clock[data-state="soon"] .glow, .clock[data-state="ended"] .glow { opacity: 0; }
    .clock[data-state="ended"] .sun { filter: grayscale(1) brightness(0.35); }
    .clock[data-state="ended"] .wedge { opacity: 0.2; }
    /* no sun at dusk; at night only a pale moon glow behind the dial */
    .clock[data-phase="dusk"] .sun, .clock[data-phase="night"] .sun { opacity: 0; animation: none; }
    .clock[data-phase="dusk"] .glow { opacity: 0.3; }
    .clock[data-phase="night"] .glow { opacity: 0.62; filter: url(#clkMoon); animation: moonBreath 5s ease-in-out infinite alternate; }
    .clock[data-phase="night"] .pulse { animation: none; opacity: 0; }
    @keyframes moonBreath { from { opacity: 0.45; } to { opacity: 0.72; } }
    @keyframes sun { from { transform: translate(-50%, -50%) scale(0.985) rotate(-1.5deg); } to { transform: translate(-50%, -50%) scale(1.02) rotate(1.5deg); } }
    @keyframes pulse { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.88); } 12% { opacity: 0.9; } 40%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <filter id="clkDay" color-interpolation-filters="sRGB"><feFlood flood-color="#fed456"/><feComposite in2="SourceAlpha" operator="in"/></filter>
    <filter id="clkDayDark" color-interpolation-filters="sRGB"><feFlood flood-color="#be9f40"/><feComposite in2="SourceAlpha" operator="in"/></filter>
    <filter id="clkDusk" color-interpolation-filters="sRGB"><feFlood flood-color="#a55b52"/><feComposite in2="SourceAlpha" operator="in"/></filter>
    <filter id="clkDuskDark" color-interpolation-filters="sRGB"><feFlood flood-color="#7c443e"/><feComposite in2="SourceAlpha" operator="in"/></filter>
    <filter id="clkGlow" color-interpolation-filters="sRGB"><feFlood flood-color="#ff9d54"/><feComposite in2="SourceAlpha" operator="in"/></filter>
    <filter id="clkMoon" color-interpolation-filters="sRGB"><feFlood flood-color="#d6e4ff"/><feComposite in2="SourceAlpha" operator="in"/></filter>
  </defs></svg>

  <div class="clock" id="clock" data-state="live">
    <img class="glow" src="../../Webpage/Assets/Clock/moon/moon-0.png" alt="">
    <img class="sun" src="../../Webpage/Assets/Clock/sun/sun-0.png" alt="">
    <img class="face" src="../../Webpage/Assets/Clock/clock_NIGHT.png" alt="">
    <div class="wedges" id="wedges"></div>
    <img class="rim" src="../../Webpage/Assets/Clock/clock_rim.png" alt="">
    <div class="pulse"></div>
    <img class="hand" id="hand" src="../../Webpage/Assets/Clock/clock_hand.png" alt="">
    <div class="hub"><b id="num">…</b><small id="cap"></small></div>
  </div>

  <script>
    const q = new URLSearchParams(location.search);
    const size = Math.min(800, Math.max(120, parseInt(q.get('size') || '300', 10) || 300));
    const handMode = q.get('hand') === 'drop' ? 'drop' : 'time';
    const clockEl = document.getElementById('clock'), handEl = document.getElementById('hand');
    clockEl.style.setProperty('--clk', size + 'px');

    // 16 wedges of 1.5 h from 06:00: day 06-18 (8), dusk 18-21 (2), night 21-06 is the blue face
    const DAY = 8, DUSK = 2, START_HOUR = 6;
    document.getElementById('wedges').innerHTML = Array.from({ length: DAY + DUSK }, (_, i) => {
      const tint = (i < DAY ? 'clkDay' : 'clkDusk') + (i % 2 === 0 ? 'Dark' : '');
      return `<img class="wedge" src="../../Webpage/Assets/Clock/clock_wedge.png" alt="" style="--w:${i * 22.5}deg; filter:url(#${tint})">`;
    }).join('');

    let campaign = null, lastAngle = 0;
    function setHand(angle) {
      handEl.style.transition = angle < lastAngle - 180 ? 'none' : '';   // no backwards spin when the lap wraps
      lastAngle = angle;
      clockEl.style.setProperty('--r', angle + 'deg');
    }

    function update() {
      const now = Date.now() / 1000;
      const start = Number(campaign?.campaignStart) || 0, end = Number(campaign?.campaignEnd) || 0;
      const state = !campaign ? 'ended' : now < start ? 'soon' : now >= end ? 'ended' : 'live';
      clockEl.dataset.state = state;
      const dn = new Date(), hr = dn.getHours() + dn.getMinutes() / 60;
      clockEl.dataset.phase = ['day', 'dusk', 'night'].includes(q.get('phase')) ? q.get('phase') : (hr >= 6 && hr < 18 ? 'day' : hr >= 18 && hr < 21 ? 'dusk' : 'night');   // &phase=night to preview
      const days = state === 'soon' ? Math.floor((start - now) / 86400) : state === 'live' ? Math.floor((end - now) / 86400) : 0;
      document.getElementById('num').textContent = campaign ? String(days) : '…';
      document.getElementById('cap').textContent = !campaign ? '' : state === 'ended' ? 'ENDED' : state === 'soon' ? 'TO GO' : days === 1 ? 'DAY' : 'DAYS';
      if (handMode === 'drop' && campaign && end > start) {
        setHand(Math.min(1, Math.max(0, (now - start) / (end - start))) * 360);
      } else {
        const d = new Date(), hours = d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
        setHand((((hours - START_HOUR) % 24) + 24) % 24 / 24 * 360);
      }
      clockEl.classList.add('ready');
    }

    async function loadCampaign() {
      try {
        const res = await fetch(`https://cdn.forums.klei.com/drops/current_campaign.json?t=${Math.floor(Date.now() / 30000)}`, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        campaign = (await res.json())["Don't Starve Together"] || null;
      } catch (e) { console.warn('Drop check failed:', e); }
      update();
    }
    update();
    loadCampaign();
    setInterval(loadCampaign, 60000);
    setInterval(update, 20000);
  </script>
</body>
</html>
